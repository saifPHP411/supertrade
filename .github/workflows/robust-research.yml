name: Robust futures falsification

on:
  pull_request:
    branches: [main]
    paths:
      - app/robust_research.py
      - tests/test_robust_research.py
      - .github/workflows/robust-research.yml

permissions:
  contents: read

jobs:
  backtest:
    if: github.head_ref == 'research/robust-futures' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install implementation dependencies
        run: python -m pip install 'httpx==0.28.1' 'numpy==2.4.3' 'pandas==2.3.3' 'pydantic==2.12.5'
      - name: Verify sizing and regime timing
        run: python -m unittest discover -s tests -p test_robust_research.py -v
      - name: Run preregistered falsification
        run: python -m app.robust_research
      - uses: actions/upload-artifact@v4
        with:
          name: robust-futures-research
          path: robust-research.json
          retention-days: 30
