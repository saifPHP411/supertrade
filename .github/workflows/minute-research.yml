name: One-minute strategy research

on:
  pull_request:
    branches: [main]
    paths:
      - app/minute_research.py
      - tests/test_minute_research.py
      - .github/workflows/minute-research.yml

permissions:
  contents: read

jobs:
  backtest:
    if: github.head_ref == 'research/one-minute-entry' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install 'httpx==0.28.1' 'numpy==2.4.3' 'pandas==2.3.3' 'pydantic==2.12.5'
      - name: Test strategy execution assumptions
        run: python -m unittest discover -s tests -p test_minute_research.py -v
      - name: Backtest real Binance USD-M minute bars
        run: python -m app.minute_research
      - uses: actions/upload-artifact@v4
        with:
          name: minute-research
          path: minute-research.json
          retention-days: 30
