name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: docker build --platform linux/amd64 --tag supertrade:verified .
      - name: Check image architecture and history
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' supertrade:verified)" = linux/amd64
          docker history --no-trunc --format '{{.CreatedBy}}' supertrade:verified > /tmp/supertrade-history
          if grep -Eiq '(BINANCE_(PAPER|LIVE)_(KEY|SECRET)|SUPERTRADE_DASHBOARD_PASSWORD)[[:space:]]*=' /tmp/supertrade-history; then
            echo 'A secret variable assignment was found in image history'
            exit 1
          fi
      - run: docker compose up -d --build --wait
      - run: curl --fail --show-error http://127.0.0.1:8080/health
      - name: Restart with mounted state
        run: |
          docker compose restart supertrade
          curl --fail --show-error --retry 12 --retry-all-errors http://127.0.0.1:8080/health
          docker compose exec -T supertrade test -s /data/state.sqlite3
      - run: docker compose logs
        if: failure()
